<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小朋友英聽練習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎧 英聽小教室</h1>
    <p class="subtitle">閉上眼睛，用耳朵聽聽看吧！</p>

    <div class="app-columns">
      <div id="reviewBanner" class="review-banner">
        <p class="review-banner-hint">💡 依照「1-2-4-7-15 記憶曲線」複習，把英文永久記起來！</p>
        <div class="review-table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th>內容</th>
                <th>1</th>
                <th>2</th>
                <th>4</th>
                <th>7</th>
                <th>15</th>
              </tr>
            </thead>
            <tbody id="reviewTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="player-col">
        <div id="yt-player-wrapper"><div id="yt-player"></div></div>

        <p class="status" id="status">影片載入中，請稍等...</p>

        <div class="controls">
          <button id="restartBtn" class="ctrl-btn" title="從頭開始">⏮️<br>重新開始</button>
          <button id="backBtn" class="ctrl-btn" title="倒退5秒">⏪<br>倒退5秒</button>
          <button id="playPauseBtn" class="ctrl-btn big" title="播放/暫停">▶️<br>播放</button>
          <button id="forwardBtn" class="ctrl-btn" title="快轉5秒">⏩<br>快轉5秒</button>
        </div>

        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
          <span id="duration">0:00</span>
        </div>

        <div class="speed-row">
          <button class="speed-btn" data-speed="0.75">🐢 慢速</button>
          <button class="speed-btn active" data-speed="1">🚶 正常</button>
          <button class="speed-btn" data-speed="1.25">🏃 快速</button>
        </div>

        <div class="volume-row">
          <span class="row-label">🔊 音量</span>
          <input type="range" id="volumeSlider" min="0" max="100" value="80">
        </div>
      </div>

      <div id="quizSection" class="quiz-section" hidden>
        <h2 class="quiz-title">🎉 小測驗時間!</h2>
        <p class="quiz-progress" id="quizProgress"></p>
        <p class="quiz-question" id="quizQuestion"></p>
        <div class="quiz-options" id="quizOptions"></div>
        <p class="quiz-feedback" id="quizFeedback"></p>
        <button id="quizNextBtn" class="ctrl-btn big" hidden>下一題 ➡️</button>

        <div id="quizResult" class="quiz-result" hidden>
          <p class="quiz-score" id="quizScore"></p>
          <p class="quiz-score-msg" id="quizScoreMsg"></p>
          <div class="quiz-result-actions">
            <button id="quizRetryBtn" class="ctrl-btn">🔁 重新測驗</button>
            <button id="goToSpeakingBtn" class="ctrl-btn big">🗣️ 練習口說</button>
            <button id="quizReplayBtn" class="ctrl-btn">🎬 重新聽影片</button>
            <button id="backHomeBtn" class="ctrl-btn">🏠 回首頁</button>
          </div>
        </div>
      </div>

      <div id="speakingSection" class="speaking-section" hidden>
        <h2 class="quiz-title">🗣️ 口說練習時間!</h2>
        <p class="quiz-progress" id="speakingProgress"></p>
        <p class="speaking-sentence" id="speakingSentence"></p>
        <button id="playModelBtn" class="ctrl-btn">🔊 聽範例發音</button>

        <div class="speaking-record-row">
          <button id="recordBtn" class="ctrl-btn big">🎙️ 開始錄音</button>
        </div>

        <div id="playbackArea" class="playback-area" hidden>
          <p class="playback-label">🎧 聽聽你自己的錄音:</p>
          <audio id="recordedAudio" controls></audio>
          <div>
            <button id="reRecordBtn" class="ctrl-btn">🔁 重新錄音</button>
          </div>
        </div>

        <p class="speaking-status" id="speakingStatus"></p>

        <button id="speakingNextBtn" class="ctrl-btn big" hidden>下一句 ➡️</button>

        <div id="speakingResult" class="quiz-result" hidden>
          <p class="quiz-score">🎉 口說練習完成!</p>
          <p class="quiz-score-msg">你好棒,都練習完了!</p>
          <div class="quiz-result-actions">
            <button id="speakingRetryBtn" class="ctrl-btn">🔁 重新練習</button>
            <button id="speakingReplayBtn" class="ctrl-btn big">🎬 重新聽影片</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
