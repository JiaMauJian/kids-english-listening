<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小朋友英聽練習</title>
<script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <div class="container">
    <button id="homeBtn" class="home-btn" title="回首頁">🏠</button>
    <h1>🎧 英聽小教室</h1>
    <p class="subtitle">閉上眼睛，用耳朵聽聽看吧！</p>

    <div id="yt-player-wrapper"><div id="yt-player"></div></div>

    <div id="appColumns" class="app-columns home-mode">
      <div id="reviewBanner" class="review-banner">
        <p class="review-banner-hint" id="reviewBannerHint">💡 依照「1-2-4-7-15 記憶曲線」複習，把英文永久記起來！</p>
        <div class="series-tabs" id="seriesTabs"></div>
        <div class="review-table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th>內容</th>
                <th>1</th>
                <th>2</th>
                <th>4</th>
                <th>7</th>
                <th>15</th>
              </tr>
            </thead>
            <tbody id="reviewTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="playerCol" class="player-col" hidden>
        <p class="status" id="status">影片載入中，請稍等...</p>

        <div class="controls">
          <button id="restartBtn" class="ctrl-btn" title="從頭開始">⏮️<br>重新開始</button>
          <button id="backBtn" class="ctrl-btn" title="倒退5秒">⏪<br>倒退5秒</button>
          <button id="playPauseBtn" class="ctrl-btn big" title="播放/暫停">▶️<br>播放</button>
          <button id="forwardBtn" class="ctrl-btn" title="快轉5秒">⏩<br>快轉5秒</button>
        </div>

        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
          <span id="duration">0:00</span>
        </div>

        <div class="speed-row">
          <button class="speed-btn" data-speed="0.75">🐢 慢速</button>
          <button class="speed-btn active" data-speed="1">🚶 正常</button>
          <button class="speed-btn" data-speed="1.25">🏃 快速</button>
        </div>

        <div class="volume-row">
          <span class="row-label">🔊 音量</span>
          <input type="range" id="volumeSlider" min="0" max="100" value="80">
        </div>
      </div>

      <div id="driveCol" class="drive-col" hidden>
        <h2 class="quiz-title" id="driveTitle"></h2>
        <div class="drive-video-wrap">
          <iframe id="driveFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
        <p class="drive-hint">看不到影片？請先用有權限的 Google 帳號登入，或<a id="driveOpenLink" target="_blank" rel="noopener noreferrer">在雲端硬碟開啟</a>。</p>
        <div class="quiz-result-actions">
          <button id="driveDoneBtn" class="ctrl-btn big">✅ 看完了</button>
          <button id="driveHomeBtn" class="ctrl-btn">🏠 回首頁</button>
        </div>
      </div>

      <div id="quizSection" class="quiz-section" hidden>
        <h2 class="quiz-title">🎉 小測驗時間!</h2>
        <p class="quiz-progress" id="quizProgress"></p>
        <p class="quiz-question" id="quizQuestion"></p>
        <div class="quiz-options" id="quizOptions"></div>
        <p class="quiz-feedback" id="quizFeedback"></p>
        <button id="quizNextBtn" class="ctrl-btn big" hidden>下一題 ➡️</button>

        <div id="quizResult" class="quiz-result" hidden>
          <p class="quiz-score" id="quizScore"></p>
          <p class="quiz-score-msg" id="quizScoreMsg"></p>
          <div class="quiz-result-actions">
            <button id="quizRetryBtn" class="ctrl-btn">🔁 重新測驗</button>
            <button id="goToGameBtn" class="ctrl-btn big">🧩 語塊小遊戲</button>
            <button id="quizReplayBtn" class="ctrl-btn">🎬 重新聽影片</button>
            <button id="backHomeBtn" class="ctrl-btn">🏠 回首頁</button>
          </div>
        </div>
      </div>

      <div id="chunksSection" class="chunks-section" hidden>
        <h2 class="quiz-title">📚 先認識重要語塊!</h2>
        <p class="quiz-progress" id="chunksProgress"></p>
        <div class="chunk-card">
          <div class="chunk-en-row">
            <span class="chunk-en" id="chunkEn"></span>
            <button id="chunkSpeakBtn" class="speak-btn" title="聽發音">🔊</button>
          </div>
          <p class="chunk-zh" id="chunkZh"></p>
          <div class="chunk-example-row">
            <span class="chunk-example" id="chunkExample"></span>
            <button id="chunkExampleSpeakBtn" class="speak-btn small" title="聽例句">🔊</button>
          </div>
        </div>
        <div class="chunk-nav">
          <button id="chunkPrevBtn" class="ctrl-btn">⬅️ 上一個</button>
          <button id="chunkNextBtn" class="ctrl-btn">下一個 ➡️</button>
        </div>
        <button id="chunksStartVideoBtn" class="ctrl-btn big chunks-start-btn">▶️ 開始聽影片</button>
      </div>

      <div id="gameSection" class="game-section" hidden>
        <h2 class="quiz-title">🧩 語塊配對遊戲!</h2>
        <p class="quiz-progress" id="gameProgress"></p>
        <p class="game-stars" id="gameStars"></p>
        <div class="chunk-en-row">
          <span class="chunk-en" id="gameEn"></span>
          <button id="gameSpeakBtn" class="speak-btn" title="再聽一次">🔊</button>
        </div>
        <p class="game-hint">這是什麼意思呢?</p>
        <div class="quiz-options" id="gameOptions"></div>
        <p class="quiz-feedback" id="gameFeedback"></p>
        <button id="gameNextBtn" class="ctrl-btn big" hidden>下一個 ➡️</button>

        <div id="gameResult" class="quiz-result" hidden>
          <p class="quiz-score" id="gameScore"></p>
          <p class="quiz-score-msg" id="gameScoreMsg"></p>
          <div class="quiz-result-actions">
            <button id="gameRetryBtn" class="ctrl-btn">🔁 再玩一次</button>
            <button id="gameReplayBtn" class="ctrl-btn">🎬 重新聽影片</button>
            <button id="gameHomeBtn" class="ctrl-btn big">🏠 回首頁</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
